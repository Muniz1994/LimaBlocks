# Every configurable value comes from the .env file next to this one (copy
# .env.example to get started). The ${VAR:-default} defaults below only keep
# `docker compose` usable before that file exists.
services:
  api:
    build: ./lima-backend
    image: limablocks-api
    container_name: limablocks-api
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    # Secrets and settings reach Django through the environment, never through a
    # file baked into the image.
    env_file:
      - .env
    environment:
      # Under DEBUG Django only serves localhost unless told otherwise; "api"
      # lets other containers reach it by service name.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],api,0.0.0.0}"
      # Repeated here, not just left to env_file, because a shell override
      # (BACKEND_PORT=8010 docker compose up) only reaches ${...} substitution.
      # Without these the container would keep the .env values and Django would
      # publish on one port while computing CORS for another.
      BACKEND_URL: "${BACKEND_URL:-http://localhost}"
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Source mounted for live reload. The SQLite db and MEDIA_ROOT live under
      # lima-backend/limaBackend/, so both persist on the host through this mount.
      - ./lima-backend:/app
      # Keep the host's Windows venv out of the container.
      - /app/venv
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:$$BACKEND_PORT"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ['BACKEND_PORT'] + '/api/')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./lima-frontend-js
    image: limablocks-web
    container_name: limablocks-web
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      # react-scripts serves on $PORT.
      PORT: "${FRONTEND_PORT:-3000}"
      # Resolved in the browser, so these point at the published host ports.
      REACT_APP_API_ROOT: "${REACT_APP_API_ROOT:-http://127.0.0.1:8000/api/}"
      REACT_APP_CLIENT_ROOT: "${REACT_APP_CLIENT_ROOT:-http://localhost:3000}"
      # Bind mounts do not deliver inotify events on Windows/macOS hosts.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./lima-frontend-js:/app
      # Anonymous volume keeps the container's Linux-built node_modules instead
      # of the host's.
      - /app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true
